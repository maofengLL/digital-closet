<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=12">
  <title>数字衣柜</title>
</head>
<body>
  <!-- 顶栏：标题 + 总数 -->
    <header>
    <span>我的衣柜 · 共<span id="totalCount">0</span>件</span>
    <button class="help-btn" onclick="openTip('manual')">?</button>
  </header>

  <!-- 唯一页面：抽屉柜 -->
  <main>
    <!-- 筛选 chips -->
    <div id="chipRow" class="tabs"></div>


    <!-- 全部：抽屉区块堆叠 -->
    <div id="blocksBox"></div>
    <!-- 单品类：大图网格 -->
    <div id="gridBox" class="wardrobe-grid hidden"></div>
    <!-- 单品类空态 -->
    <p id="emptyTip" class="tip center hidden"></p>

    <!-- 页脚提示 -->
  
  </main>

  <!-- FAB -->
  <button id="fab" class="fab" onclick="openSheet()">＋</button>

  <!-- 底部动作面板 -->
  <div id="sheet" class="sheet-mask hidden" onclick="closeSheet()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div id="sheetCats" class="sheet-cats hidden"></div>
      <button class="sheet-btn" onclick="pickFrom('camera')">拍照</button>
      <button class="sheet-btn" onclick="pickFrom('album')">从相册选择</button>
      <button class="sheet-btn cancel" onclick="closeSheet()">取消</button>
    </div>
  </div>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="onFileChosen(event)">
  <input type="file" id="albumInput" accept="image/*" style="display:none" onchange="onFileChosen(event)">

  <!-- 拍照预览层 -->
  <div id="preview" class="preview hidden">
    <button class="preview-back" onclick="exitPreview()">←</button>
    <img id="previewImg" alt="衣服照片">
    <div class="preview-bar">
      <button onclick="reenter()">重新录入</button>
      <button onclick="saveAndNext()">下一张</button>
      <button class="primary" id="confirmBtn" onclick="saveAndExit()">确认</button>
    </div>
  </div>

  <!-- 大图查看层 -->
  <div id="detail" class="preview hidden">
    <button class="preview-back" onclick="closeDetail()">←</button>
    <img id="detailImg" alt="衣服大图">
    <div class="preview-bar">
      <button class="danger" onclick="deleteCurrent()">删除这件</button>
      <button class="primary" onclick="closeDetail()">关闭</button>
    </div>
  </div>

   <!-- 拍照贴士卡片：A形态（拍照前自动）/ B形态（点"?"手动），共用同一张卡 -->
  <div id="tipMask" class="tip-mask hidden">
    <div class="tip-card">
      <h3 class="tip-title">拍照小贴士</h3>
      <p class="tip-line">找一块纯色的背景哦～</p>
      <p class="tip-line">周围先不要放杂物呀</p>
      <p class="tip-line">在亮亮的地方拍，会更好看呢</p>
      <!-- 只有A形态显示：第4句 + 小圆圈 -->
      <div id="tipDismissRow" class="tip-dismiss hidden" onclick="toggleTipCircle()">
        <span id="tipCircle" class="tip-circle"></span>
        <span class="tip-dismiss-text">点小圆圈，下次就不再提醒你了</span>
      </div>
      <button class="tip-ok" onclick="closeTip()">知道了</button>
    </div>
  </div> 
  <div id="toast" class="toast hidden"></div> 
  <script src="app.js?v=12"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
