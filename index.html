<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=6">
  <title>数字衣柜</title>
</head>
<body>
  <header>
    <button id="backBtn" class="back-btn hidden" onclick="onBack()">←</button>
    <span>数字衣柜</span>
  </header>

  <!-- 页面1：衣柜首页 = 七个大按钮 -->
  <main id="homeView">
    <p class="tip">你的衣柜</p>
    <div id="catGrid" class="cat-grid"></div>
  </main>

  <!-- 页面2：浏览页（分组列表 / 单品类网格） -->
  <main id="browseView" class="hidden">
    <div id="chipRow" class="tabs"></div>
    <div id="blocksBox"></div>
    <div id="gridBox" class="wardrobe-grid hidden"></div>
    <p id="emptyTip" class="tip center hidden"></p>
  </main>

  <!-- 悬浮加号：录入入口，仅浏览页显示 -->
  <button id="fab" class="fab hidden" onclick="openSheet()">＋</button>

  <!-- 底部动作面板 -->
  <div id="sheet" class="sheet-mask hidden" onclick="closeSheet()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div id="sheetCats" class="sheet-cats hidden"></div>
      <button class="sheet-btn" onclick="pickFrom('camera')">拍照</button>
      <button class="sheet-btn" onclick="pickFrom('album')">从相册选择</button>
      <button class="sheet-btn cancel" onclick="closeSheet()">取消</button>
    </div>
  </div>

  <!-- 底部导航：只有一个"衣柜" -->
  <nav class="bottom-nav">
    <button class="active" onclick="goHome()">衣柜</button>
  </nav>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="onFileChosen(event)">
  <input type="file" id="albumInput" accept="image/*" style="display:none" onchange="onFileChosen(event)">

  <!-- 拍照预览层 -->
  <div id="preview" class="preview hidden">
    <button class="preview-back" onclick="exitPreview()">←</button>
    <img id="previewImg" alt="衣服照片">
    <div class="preview-bar">
      <button onclick="reenter()">重新录入</button>
      <button onclick="saveAndNext()">下一张</button>
      <button class="primary" onclick="saveAndExit()">确认</button>
    </div>
  </div>

  <!-- 大图查看层 -->
  <div id="detail" class="preview hidden">
    <button class="preview-back" onclick="closeDetail()">←</button>
    <img id="detailImg" alt="衣服大图">
    <div class="preview-bar">
      <button class="danger" onclick="deleteCurrent()">删除这件</button>
      <button class="primary" onclick="closeDetail()">关闭</button>
    </div>
  </div>

  <script src="app.js?v=6"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
