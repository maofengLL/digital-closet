<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=35">
  <title>数字衣柜</title>
</head>
<body>
  <!-- 顶栏：标题 + 总数 -->
     <header id="normalHeader">
    <span>我的衣柜 · 共<span id="totalCount">0</span>件</span>
    <button class="help-btn" onclick="openTip('manual')">?</button>
  </header>

  <!-- 唯一页面：抽屉柜 -->
  <main>
     <!-- 筛选条：全部态=整排chips；单品类态=药丸+下拉面板 -->
    <div id="filterBar" class="filter-bar">
      <div id="chipRow" class="tabs"></div>
      <button id="pillBtn" class="pill hidden" onclick="openDrop()"><span id="pillText">全部</span><span class="pill-arrow">▾</span></button>
      <div id="dropMask" class="drop-mask hidden" onclick="cancelDrop()"></div>
      <div id="dropPanel" class="drop-panel hidden"><div id="dropChips" class="drop-chips"></div></div>
    </div>

    <!-- 全部：抽屉区块堆叠 -->
    <div id="blocksBox"></div>
    <!-- 单品类：大图网格 -->
    <div id="gridBox" class="wardrobe-grid hidden"></div>
    <!-- 单品类空态 -->
    <p id="emptyTip" class="tip center hidden"></p>

    <!-- 页脚提示 -->
  
  </main>

  <!-- FAB -->
  <button id="fab" class="fab" onclick="openSheet()">＋</button>

  <!-- 底部动作面板 -->
  <div id="sheet" class="sheet-mask hidden" onclick="closeSheet()">
    <div class="sheet" onclick="event.stopPropagation()">
      <div id="sheetCats" class="sheet-cats hidden"></div>
      <button class="sheet-btn" onclick="pickFrom('camera')">拍照</button>
      <button class="sheet-btn" onclick="pickFrom('album')">从相册选择</button>
      <button class="sheet-btn cancel" onclick="closeSheet()">取消</button>
    </div>
  </div>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="onFileChosen(event)">
  <input type="file" id="albumInput" accept="image/*" style="display:none" onchange="onFileChosen(event)">

  <!-- 拍照预览层 -->
  <div id="preview" class="preview hidden">
    <button class="preview-back" onclick="exitPreview()">←</button>
    <img id="previewImg" alt="衣服照片">
    <div class="preview-bar">
      <button onclick="reenter()">重新录入</button>
      <button onclick="saveAndNext()">下一张</button>
      <button class="primary" id="confirmBtn" onclick="saveAndExit()">确认</button>
    </div>
  </div>

   <!-- 纸张详情页（步骤4a静态骨架） -->
  <div id="paperMask" class="paper-mask hidden" onclick="if(event.target===this)closeDetail()">
    <div class="paper" id="paperCard">
      <button class="paper-x" onclick="closeDetail()">×</button>
      <div class="paper-left">
        <div class="paper-photo" id="paperPhoto">
          <img id="paperImg" alt="衣服照片">
          <span class="tape tape-tl"></span><span class="tape tape-tr"></span>
          <span class="tape tape-bl"></span><span class="tape tape-br"></span>
          <span id="paperStamp" class="paper-stamp hidden"></span>
        </div>
        <div id="paperNotes" class="paper-notes"></div>
      </div>
      <div class="paper-right" id="paperCare"></div>
    </div>
  </div>

   <!-- 拍照贴士卡片：A形态（拍照前自动）/ B形态（点"?"手动），共用同一张卡 -->
  <div id="tipMask" class="tip-mask hidden">
    <div class="tip-card">
      <h3 class="tip-title">拍照小贴士</h3>
      <p class="tip-line">找一块纯色的背景哦</p>
      <p class="tip-line">周围先不要放杂物呀</p>
      <p class="tip-line">在亮亮的地方拍，会更好看呢</p>
      <!-- 只有A形态显示：第4句 + 小圆圈 -->
      <div id="tipDismissRow" class="tip-dismiss hidden" onclick="toggleTipCircle()">
        <span id="tipCircle" class="tip-circle"></span>
        <span class="tip-dismiss-text">点小圆圈，下次就不再提醒你了</span>
      </div>
      <button class="tip-ok" onclick="closeTip()">知道了</button>
    </div>
  </div> 
    <!-- 管理模式顶栏（长按进入时出现） -->
  <div id="selectBar" class="select-bar hidden">
    <button onclick="toggleSelectAll()">全选</button>
    <span id="selectCount" class="sel-count">已选择0项</span>
    <button onclick="exitSelectMode()">取消</button>
  </div>

  <!-- 管理模式底栏（只许两个按钮） -->
  <div id="manageBar" class="manage-bar hidden">
    <button onclick="openMoveSheet()">移到抽屉…</button>
    <button id="batchDeleteBtn" class="danger-btn" onclick="askBatchDelete()">删除</button>
  </div>

  <!-- 移到抽屉面板 -->
  <div id="moveSheet" class="sheet-mask hidden" onclick="closeMoveSheet()">
    <div class="sheet" onclick="event.stopPropagation()">
      <p class="tip">移到哪个抽屉？</p>
      <div id="moveChips" class="move-chips"></div>
      <button class="sheet-btn cancel" onclick="closeMoveSheet()">取消</button>
    </div>
  </div>

  <!-- 删除确认弹窗 -->
  <div id="confirmMask" class="tip-mask hidden">
    <div class="tip-card">
      <p class="tip-line" id="confirmText"></p>
      <div class="confirm-btns">
        <button class="confirm-cancel" onclick="closeConfirm()">再想想</button>
        <button class="confirm-ok" onclick="doBatchDelete()">删除</button>
      </div>
    </div>
  </div>

  <!-- 洗护问卷本体（双形态共用） -->
  <div id="careMask" class="tip-mask hidden">
    <div class="care-card">
      <h3 class="tip-title">洗护问卷</h3>
      <p id="careToFull" class="care-to-full hidden" onclick="careSwitchFull()">洗水唛在手边？点这里填完整档案 →</p>
      <div id="careBody"></div>
      <div class="care-actions">
        <button id="careBackBtn" class="care-skip hidden" onclick="careBack()">返回</button>
        <button id="careSkipBtn" class="care-skip hidden" onclick="careSkip()">没有洗水唛，先跳过</button>
        <button class="care-ok" onclick="careConfirm()">确认</button>
      </div>
    </div>
  </div>
    <!-- 录入盖章：本次启动首件=完整邮戳，其余=轻量对勾 -->
  <div id="stamp" class="stamp hidden"><div class="stamp-inner"><span class="stamp-title">档案建好</span><span class="stamp-date" id="stampDate"></span></div></div>
  <div id="miniCheck" class="mini-check hidden">✓</div>
  <div id="toast" class="toast hidden"></div> 
  <script src="app.js?v=35"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
