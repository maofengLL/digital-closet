<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>数字衣柜</title>
</head>
<body>
  <header>数字衣柜</header>

  <main id="home">
    <p class="tip">选择要录入的衣服类别</p>
    <!-- 品类按钮由 app.js 动态生成，这里只留一个空容器 -->
    <div id="catGrid" class="cat-grid"></div>
  </main>

  <!-- 隐藏的输入框：调起相机和相册全靠它 -->
  <!-- capture="environment" 表示调起后置摄像头（安卓直接开相机；iOS 行为不定，所以两条路都留） -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
  <input type="file" id="albumInput" accept="image/*" style="display:none">

  <!-- 拍照后的预览层，默认隐藏 -->
  <div id="preview" class="preview hidden">
    <img id="previewImg" alt="衣服照片">
    <div class="preview-bar">
      <button onclick="backHome()">重选</button>
      <button class="primary" onclick="confirmPhoto()">确认（存储下一步做）</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
