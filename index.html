<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>数字衣柜</title>
</head>
<body>
  <header>数字衣柜</header>

  <!-- 视图1：录入 -->
  <main id="homeView">
    <p class="tip">选择要录入的衣服类别</p>
    <div id="catGrid" class="cat-grid"></div>
  </main>

  <!-- 视图2：衣柜（默认隐藏） -->
  <main id="wardrobeView" class="hidden">
    <div id="wardrobeTabs" class="tabs"></div>
    <div id="wardrobeGrid" class="wardrobe-grid"></div>
    <p id="emptyTip" class="tip center hidden">衣柜还是空的，去"录入"一件吧</p>
  </main>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <button id="navHome" class="active" onclick="switchView('home')">录入</button>
    <button id="navWardrobe" onclick="switchView('wardrobe')">衣柜</button>
  </nav>

  <!-- 相机/相册的隐藏入口 -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="onFileChosen(event)">
  <input type="file" id="albumInput" accept="image/*" style="display:none" onchange="onFileChosen(event)">

  <!-- 拍照预览层 -->
    <div class="preview-bar">
      <button onclick="openCamera()">重拍</button>
      <button onclick="openAlbum()">换一张</button>
      <button onclick="backHome()">返回</button>
      <button class="primary" id="confirmBtn" onclick="confirmPhoto()">确认</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
