<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>数字衣柜</title>
</head>
<body>
  <!-- 顶栏：标题 + 返回键（返回键平时隐藏，进品类页才出现） -->
  <header>
    <button id="backBtn" class="back-btn hidden" onclick="onBack()">←</button>
    <span>数字衣柜</span>
  </header>

  <!-- 页面1：首页（选品类） -->
  <main id="homeView">
    <p class="tip">选择要录入的衣服类别</p>
    <div id="catGrid" class="cat-grid"></div>
  </main>

  <!-- 页面2：品类页（一个"录入"按钮） -->
  <main id="categoryView" class="hidden">
    <p class="tip" id="categoryTip"></p>
    <div id="categoryActions"></div>
  </main>

  <!-- 页面3：衣柜 -->
  <main id="wardrobeView" class="hidden">
    <div id="wardrobeTabs" class="tabs"></div>
    <div id="wardrobeGrid" class="wardrobe-grid"></div>
    <p id="emptyTip" class="tip center hidden">衣柜还是空的，去"录入"一件吧</p>
  </main>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <button id="navHome" class="active" onclick="switchView('home')">录入</button>
    <button id="navWardrobe" onclick="switchView('wardrobe')">衣柜</button>
  </nav>

  <!-- 相机/相册的隐藏入口 -->
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="onFileChosen(event)">
  <input type="file" id="albumInput" accept="image/*" style="display:none" onchange="onFileChosen(event)">

  <!-- 预览层：全屏覆盖，返回键在左上角 -->
  <div id="preview" class="preview hidden">
    <button class="preview-back" onclick="exitPreview()">←</button>
    <img id="previewImg" alt="衣服照片">
    <div class="preview-bar">
      <button onclick="reenter()">重新录入</button>
      <button onclick="saveAndNext()">下一张</button>
      <button class="primary" id="confirmBtn" onclick="saveAndExit()">确认</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
